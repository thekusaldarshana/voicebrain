[package]
name = "trapper-voice"
version = "0.1.0"
description = "Voice note recorder that uploads by itself"
authors = ["Kusal Darshana"]
license = "UNLICENSED"
edition = "2024"
rust-version = "1.90"

[lib]
name = "trapper_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
