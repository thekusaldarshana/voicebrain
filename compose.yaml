# voicebrain on your VPS.   cp .env.example .env  →  edit  →  docker compose up -d --build
services:
  voicebrain:
    build: ./server
    restart: unless-stopped
    env_file: .env
    depends_on: [stt]
    # Run as the user that owns ./data on the host (usually 1000). Override with PUID / PGID in .env if not.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Only your reverse proxy (Caddy) can reach it. Nothing is exposed to the internet directly.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - "${DATA_PATH:-./data}:/data"

  # Speech to text on this machine (faster-whisper). Audio never leaves the VPS.
  # voicebrain reaches it at http://stt:8000/v1; it is not published to the host or the internet.
  # It gets only the settings below, never the rest of .env (no API keys).
  stt:
    build: ./whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: "${WHISPER_MODEL:-large-v3-turbo}"
      # 6 of 8 vCPUs, so Caddy and anything else on the machine stay responsive while a note is being transcribed.
      WHISPER_THREADS: "${WHISPER_THREADS:-6}"
    volumes:
      - whisper-models:/models

volumes:
  whisper-models: {}
